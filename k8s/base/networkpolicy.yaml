# Default-deny ingress to the API pods, except HTTP from pods in the same
# namespace and from the monitoring namespace (Prometheus scraping).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
          protocol: TCP
