apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  annotations:
    # Accepted Checkov findings, each with its reason:
    checkov.io/skip1: CKV_K8S_43=Tags are pinned per release in the overlay; the release pipeline should resolve them to digests at deploy time.
    checkov.io/skip2: CKV_K8S_35=Single non-file secret read once at startup via secretKeyRef; mounting as a file is a follow-up.
    checkov.io/skip3: CKV_K8S_15=IfNotPresent in dev so locally loaded kind images work; the prod overlay sets Always.
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # A rollout that cannot make progress is marked failed after this long.
  progressDeadlineSeconds: 90
  # A new pod must stay ready this long before it counts as available.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: platform-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: platform-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: platform-api-config
          env:
            - name: APP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-secrets
                  key: admin-token
                  # Optional in the base so a cluster without the Secret still
                  # runs (admin endpoints are then disabled). Prod makes it required.
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Gives slow starts up to 60 s before liveness takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            # Keep serving briefly after SIGTERM is scheduled so endpoint
            # removal propagates to kube-proxy before the process stops.
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
