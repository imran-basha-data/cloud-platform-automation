apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  replicas: 3
  template:
    spec:
      # Spread replicas across availability zones as well as nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
      containers:
        - name: api
          imagePullPolicy: Always
          env:
            - name: APP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-secrets
                  key: admin-token
                  # Required in prod: the app refuses to start without it.
                  optional: false
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
