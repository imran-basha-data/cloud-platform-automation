global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: platform-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
