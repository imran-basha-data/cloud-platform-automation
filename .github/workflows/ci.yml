name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: platform-api:ci

jobs:
  app:
    name: App lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Ruff lint and format
        run: ruff check src tests && ruff format --check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Pytest with coverage gate
        run: pytest --cov --cov-report=term --junitxml=junit.xml
      - name: Fail if any test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          s = ET.parse("junit.xml").getroot().find("testsuite")
          print(f"tests={s.get('tests')} failures={s.get('failures')} errors={s.get('errors')} skipped={s.get('skipped')}")
          raise SystemExit(1 if int(s.get("skipped", 0)) else 0)
          PY

  container:
    name: Container build, health and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
      - name: Starts read-only and becomes healthy
        run: |
          docker run -d --name api --read-only --cap-drop ALL -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            echo "health: $status"; [ "$status" = "healthy" ] && break; sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' api)" = "healthy"
          curl -fsS localhost:8080/readyz
          curl -fsS localhost:8080/metrics | grep -q '^app_info'
      - name: Shuts down gracefully on SIGTERM
        run: |
          docker stop -t 25 api
          test "$(docker inspect --format '{{.State.ExitCode}}' api)" = "0"
          docker logs api 2>&1 | grep -q '"event": "shutdown"'
      - name: Trivy image scan (fixable HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.67.2 image --exit-code 1 --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress "$IMAGE"

  security:
    name: Dependency, code and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit
        run: bandit -r src
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

  k8s-manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render overlays
        run: |
          mkdir -p rendered
          for overlay in dev prod; do
            kubectl kustomize "k8s/overlays/$overlay" > "rendered/$overlay.yaml"
          done
      - name: Kubeconform (strict schema validation)
        run: |
          docker run --rm -v "$PWD/rendered:/rendered" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.33.0 /rendered/dev.yaml /rendered/prod.yaml
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

  k8s-e2e:
    name: Kubernetes reliability tests (kind)
    runs-on: ubuntu-latest
    needs: [k8s-manifests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build v1 and v2 images
        run: |
          docker build --build-arg APP_VERSION=1.0.0 -t platform-api:1.0.0 .
          docker build --build-arg APP_VERSION=1.1.0 -t platform-api:1.1.0 .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: platform
          node_image: kindest/node:v1.33.1
          wait: 120s
      - name: Run reliability scenarios
        env:
          IMAGE_V1: platform-api:1.0.0
          IMAGE_V2: platform-api:1.1.0
          LOAD_IMAGE: kind load docker-image --name platform
        run: ./scripts/k8s-e2e.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n platform-dev describe deployment platform-api
          kubectl -n platform-dev get events --sort-by=.lastTimestamp | tail -40
          kubectl -n platform-dev logs -l app.kubernetes.io/component=api --tail=50 --prefix
