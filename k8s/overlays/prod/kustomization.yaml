apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-prod

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: platform-api-config
    behavior: merge
    literals:
      - APP_ENVIRONMENT=prod
      - APP_LOG_LEVEL=INFO

# Image from the Azure Container Registry created by terraform/. Replace the
# registry name with the `acr_login_server` Terraform output; the tag is set
# by the release pipeline (never `latest`).
images:
  - name: platform-api
    newName: REPLACE_WITH_ACR_LOGIN_SERVER/platform-api
    newTag: 1.0.0

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: pdb-patch.yaml
