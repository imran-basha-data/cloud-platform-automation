apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: platform-api
      app.kubernetes.io/part-of: cloud-platform-automation
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# Generated ConfigMap names carry a content hash, so any config change
# produces a new name and triggers a rolling update automatically.
configMapGenerator:
  - name: platform-api-config
    literals:
      - APP_NAME=platform-api
      - APP_LOG_FORMAT=json
      - APP_LOG_LEVEL=INFO
      - APP_MAX_WORK_MS=2000

images:
  - name: platform-api
    newTag: 1.0.0
